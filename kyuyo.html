<script>
(function(){
  var DATA = JSON.parse(document.getElementById("payload").textContent);
  function b64(s){ var bin=atob(s), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return u; }
  async function unlock(pw){
    var enc=new TextEncoder();
    var baseKey=await crypto.subtle.importKey("raw", enc.encode(pw), {name:"PBKDF2"}, false, ["deriveKey"]);
    var key=await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:b64(DATA.salt), iterations:DATA.it, hash:"SHA-256"},
      baseKey, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(DATA.iv)}, key, b64(DATA.ct));
    return new TextDecoder().decode(pt);
  }
  async function go(){
    var pw=document.getElementById("pw").value;
    var err=document.getElementById("err"); err.textContent="";
    if(!pw){ err.textContent="パスワードを入力してください。"; return; }
    try{
      var code=await unlock(pw);
      var gate=document.getElementById("gate"); if(gate) gate.remove();
      document.title="給与シミュレーター（面接用）";
      (0,eval)(code);
    }catch(e){
      err.textContent="パスワードが違います。";
    }
  }
  document.getElementById("go").addEventListener("click", go);
  document.getElementById("pw").addEventListener("keydown", function(e){ if(e.key==="Enter") go(); });
})();
</script>
